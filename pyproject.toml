[project]
name = "sreshtha"
version = "0.1.0"
description = "Sreshtha — a mobile-responsive web app for India's gig workers. Contract explanations, rights guidance, welfare access, in the worker's language. Built on Google Gemini + Sarvam Mayura."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "google-genai>=1.0",
    # Persistent contract storage on Cloud Run.
    "google-cloud-storage>=2.18",
    "python-dotenv>=1.0",
    # Auth: password hashing + JWT + rate limiting
    "bcrypt>=4.2",
    "python-jose[cryptography]>=3.3",
    "slowapi>=0.1.9",
    # Contract Reader multipart/form-data file uploads (FastAPI dep).
    "python-multipart>=0.0.20",
    # Contract Reader text extraction — local, no per-call cost, no vendor
    # dependency. Tesseract (via pytesseract) is the OCR engine for
    # photos/scans; its binary + Indic language data ship in the Docker
    # image, so there is no model download on first use. PyMuPDF reads a
    # born-digital PDF's text layer and rasterises scanned pages; Pillow
    # decodes uploaded images. .docx is unzipped in-process (stdlib).
    # (Replaces the earlier EasyOCR/torch stack, which produced garbled
    # output on the ARM64 build and pulled ~1GB of wheels + runtime model
    # downloads.)
    "pytesseract>=0.3.10",
    "PyMuPDF>=1.24",
    "Pillow>=10.0",
    # Idiom library — Aho-Corasick multi-pattern matcher for scanning
    # English source text for known idioms in a single linear pass.
    # C-extension, handles hundreds of patterns at millions of chars/s.
    "pyahocorasick>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",  # for FastAPI TestClient
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
