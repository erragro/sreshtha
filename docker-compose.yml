services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: sreshtha
      POSTGRES_PASSWORD: sreshtha
      POSTGRES_DB: sreshtha
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sreshtha"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    # Every KEY=value in .env is exposed as an env var here. Individual
    # entries below only override or hard-pin a value that the compose
    # network requires (like the Postgres hostname).
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://sreshtha:sreshtha@postgres:5432/sreshtha
      APP_ENV: ${APP_ENV:-local}
      # Vertex AI ADC — if the host has a service-account JSON, set
      # GOOGLE_APPLICATION_CREDENTIALS_HOST in .env to its host path.
      # Otherwise the volume mount below is inert and OpenAI is used.
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/gcp-key.json
    volumes:
      - ${GOOGLE_APPLICATION_CREDENTIALS_HOST:-/dev/null}:/secrets/gcp-key.json:ro
      - contract_uploads:/app/data/contracts
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - app
    ports:
      # Frontend published on :5173 by default. If port 5173 is occupied
      # (e.g. `vite dev` from another repo), override via .env:
      #   FRONTEND_PORT=5175 docker compose up -d
      - "${FRONTEND_PORT:-5173}:80"

volumes:
  pgdata:
  contract_uploads:
