server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # FastAPI passthrough
    location /api/ {
        proxy_pass ${API_UPSTREAM};
        include /etc/nginx/proxy_params.conf;
    }

    location /auth/ {
        proxy_pass ${API_UPSTREAM};
        include /etc/nginx/proxy_params.conf;
    }

    location /run {
        proxy_pass ${API_UPSTREAM};
        include /etc/nginx/proxy_params.conf;
    }

    location /ping {
        proxy_pass ${API_UPSTREAM};
        include /etc/nginx/proxy_params.conf;
    }
}
