server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;

    # SPA fallback — every unknown route serves index.html so React Router owns navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # FastAPI passthrough — the SPA hits these paths as same-origin
    # (see frontend/src/lib/api.ts and vite.config.ts). nginx forwards
    # them to the `app` service on the compose network.
    location /api/  { proxy_pass http://app:8000; include /etc/nginx/proxy_params.conf; }
    location /auth/ { proxy_pass http://app:8000; include /etc/nginx/proxy_params.conf; }
    location /run   { proxy_pass http://app:8000; include /etc/nginx/proxy_params.conf; }
    location /ping  { proxy_pass http://app:8000; include /etc/nginx/proxy_params.conf; }
}
